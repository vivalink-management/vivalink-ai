# Cloudflare-Worker „vivalink-ki“ (KI-Chat und Spracherkennung, Workers AI) – VORBEREITET, NICHT BEREITGESTELLT.
# Bereitstellung nur nach ausdrücklicher Freigabe:  cd server && npx -y wrangler@4.168.0 deploy -c ki-wrangler.toml
# Kosten: Workers AI im kostenlosen Kontingent (10.000 Neurons/Tag); der Worker begrenzt selbst auf 9.000 (ki-core.mjs).
# Enthält keine Geheimnisse. Nutzt dieselbe D1-Datenbank wie die Synchronisierung (Tresor-Zugänge nur lesen, Tageszähler).
name = "vivalink-ki"
main = "ki-worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://vivalink-management.github.io"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "vivalink-sync"
database_id = "e7fe02bf-a75d-4b6a-b641-28ae887b75ff"

[observability]
enabled = false
