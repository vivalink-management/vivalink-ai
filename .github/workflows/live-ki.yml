# Live-Prüfung der KI-Gegenstelle „vivalink-ki“ (nur manuell, erst nach der Bereitstellung sinnvoll):
# Status und Ablehnung ohne gültigen Zugang; dazu eine Funktionsprüfung mit künstlichem Test-Zugang (wenige hundert
# kostenlose Neurons, keine Unternehmensdaten, Test-Zugang wird danach gesperrt). Keine Zugangsdaten im Ablauf.
name: Live-Prüfung KI

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Zusätzlich Diagnose der Nachrichtenformen und Test der veröffentlichten App (wenige hundert kostenlose Neurons)"
        required: false
        default: "nein"
      gespraech:
        description: "Zusätzlich Gesprächsqualität der neuen App-Version (lokal, künstliche Daten, wenige hundert kostenlose Neurons)"
        required: false
        default: "nein"
      qualitaet:
        description: "Zusätzlich Qualitäts-Testset: veröffentlichte App gegen neue App (künstliche Daten, ca. 3.000–5.000 kostenlose Neurons)"
        required: false
        default: "nein"
      stt:
        description: "Zusätzlich Spracherkennung (Whisper) mit künstlich erzeugter Sprache (wenige kostenlose Neurons)"
        required: false
        default: "nein"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y espeak-ng ffmpeg
        if: ${{ github.event.inputs.stt == 'ja' }}
      - name: Live-Prüfung KI (ohne KI-Aufruf)
        run: npx playwright test tests/live-ki.spec.mjs tests/live-ki-funktion.spec.mjs tests/live-ki-diagnose.spec.mjs tests/live-ki-app.spec.mjs tests/live-ki-stt.spec.mjs tests/live-ki-gespraech.spec.mjs tests/live-ki-qualitaet.spec.mjs --project=chromium-desktop --reporter=list
        env:
          CI: "1"
          LIVE: "1"
          LIVE_DIAG: ${{ github.event.inputs.diagnose == 'ja' && '1' || '' }}
          LIVE_STT: ${{ github.event.inputs.stt == 'ja' && '1' || '' }}
          LIVE_GESPRAECH: ${{ github.event.inputs.gespraech == 'ja' && '1' || '' }}
          LIVE_QUALITAET: ${{ github.event.inputs.qualitaet == 'ja' && '1' || '' }}
