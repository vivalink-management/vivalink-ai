# Live-Prüfung der KI-Gegenstelle „vivalink-ki“ (nur manuell, erst nach der Bereitstellung sinnvoll):
# Status und Ablehnung ohne gültigen Zugang – keine KI-Aufrufe, kein Kontingentverbrauch, keine Zugangsdaten.
name: Live-Prüfung KI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live-Prüfung KI (ohne KI-Aufruf)
        run: npx playwright test tests/live-ki.spec.mjs --project=chromium-desktop
        env:
          CI: "1"
          LIVE: "1"
