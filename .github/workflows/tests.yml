# Automatische Tests bei jeder Änderung. Kostenlos für öffentliche Repositories.
# Dieser Ablauf veröffentlicht nichts (kein Deployment) und hat nur Lesezugriff.
# Es werden ausschließlich künstliche Testdaten verwendet; es gibt keine Geheimnisse oder Zugangsdaten.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keine vertraulichen Inhalte im Code
        run: npm run check:sensitive
      - name: Syntax und Offline-Dateiliste
        run: npm run check:syntax
      - name: Browser installieren (Chromium und WebKit/Safari-Technik)
        run: npx playwright install --with-deps chromium webkit
      - name: Echten Cloudflare Worker lokal starten (wrangler dev, lokaler D1-Speicher, ohne Konto und ohne Zugangsdaten)
        working-directory: server
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx -y wrangler@4.168.0 dev --local --port 8787 --ip 127.0.0.1 --var ALLOWED_ORIGIN:http://127.0.0.1:4173 > ../wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/v1/health && exit 0; sleep 2; done
          cat ../wrangler.log; exit 1
      - name: Verwaltungs-Testumgebung vorbereiten (lokales PostgreSQL des Runners, Deno für die Edge Function; nur künstliche Daten)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb
          npx -y deno@2.9.6 --version
      - name: Tests (Desktop, iPhone, iPad; Chromium und WebKit; echter Worker; Verwaltungs-Gegenstelle)
        run: npx playwright test
        env:
          CI: "1"
          WORKER_URL: http://127.0.0.1:8787
          VL_REQUIRE_VERWALTUNG: "1"
      - name: Testbericht bei Fehlern (7 Tage, nur künstliche Testdaten)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
