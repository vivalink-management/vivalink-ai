# Automatische Tests bei jeder Änderung. Kostenlos für öffentliche Repositories.
# Dieser Ablauf veröffentlicht nichts (kein Deployment) und hat nur Lesezugriff.
# Es werden ausschließlich künstliche Testdaten verwendet; es gibt keine Geheimnisse oder Zugangsdaten.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keine vertraulichen Inhalte im Code
        run: npm run check:sensitive
      - name: Syntax und Offline-Dateiliste
        run: npm run check:syntax
      - name: Browser installieren (Chromium und WebKit/Safari-Technik)
        run: npx playwright install --with-deps chromium webkit
      - name: Tests (Desktop, iPhone, iPad; Chromium und WebKit)
        run: npx playwright test
        env:
          CI: "1"
      - name: Testbericht bei Fehlern (7 Tage, nur künstliche Testdaten)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
