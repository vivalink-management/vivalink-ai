# Live-Prüfung der produktiven Verwaltungsanbindung (Edge Function „management-kpis“): nur lesende Anfragen ohne
# gültigen Zugang – keine Kopplung, keine Kennzahlen, keine Schreibvorgänge in der Datenbank. Enthält keine Zugangsdaten.
name: Live-Prüfung Verwaltung

on:
  workflow_dispatch:
  push:
    paths:
      - tests/live-verwaltung.spec.mjs
      - .github/workflows/live-verwaltung.yml

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live-Prüfung (nur lesend)
        run: npx playwright test tests/live-verwaltung.spec.mjs --project=chromium-desktop
        env:
          CI: "1"
          LIVE: "1"
