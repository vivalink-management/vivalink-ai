# Live-Prüfung (nur manuell): echte Testversion „VL Test“ + echter Cloudflare-Server, Chromium und WebKit (Safari-Technik).
# Verwendet ausschließlich künstliche Demodaten, enthält keine Zugangsdaten und veröffentlicht nichts.
name: Live-Prüfung

on:
  workflow_dispatch:
  push:
    paths:
      - tests/live.spec.mjs
      - .github/workflows/live.yml

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Live-Test (iPhone und iPad, Chromium und WebKit)
        run: npx playwright test tests/live.spec.mjs --project=chromium-iphone --project=webkit-iphone --project=webkit-ipad
        env:
          CI: "1"
          LIVE: "1"
